
<article class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
  <h2 class="text-xl font-bold text-gray-900">{{ plan.name }}</h2>

  <p class="mt-2 text-sm text-gray-600">{{ plan.description }}</p>

  <p class="mt-4 text-3xl font-bold text-gray-900">{{ plan.price }}</p>

  <ul class="mt-6 space-y-3 text-gray-700">
    {% for feature in plan.features %}
      <li>✓ {{ feature }}</li>
    {% endfor %}
  </ul>

  <a href="#" class="mt-6 block rounded-lg bg-blue-600 px-4 py-2 text-center font-semibold text-white hover:bg-blue-700">
    {{ plan.button }}
  </a>
</article>
